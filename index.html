<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14205b" />
    <title>Real Madrid Fan Club Nepal</title>
    <meta name="description" content="Real Madrid Fan Club Nepal - Nepal's Official Madridista Community" />

    <!-- Hero trophy + loading-screen crown: discover them before the JS bundle runs -->
    <link rel="preload" as="image" href="/images/hero/ucl-trophy.webp" />
    <link rel="preload" as="image" href="/images/brand/crown.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font CSS (falls back to a normal stylesheet without JS) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
